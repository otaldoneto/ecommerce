spring:
  application:
    name: api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 50
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6390}
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5680}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

server:
  port: 8090

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ecommerce-api
    expiration: 15m
  refresh-token:
    ttl: 7d
    session-max-lifetime: 30d
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
