spring:
  application:
    name: api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 50
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ecommerce-api
    expiration: 15m
  refresh-token:
    ttl: 7d
    session-max-lifetime: 30d

